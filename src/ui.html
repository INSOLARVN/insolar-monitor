<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Bố cục: ứng dụng di động một cột (≤760px), thanh tab kính phía dưới.
   Hai giao diện: SÁNG = kính ngọc trai, TỐI = kính đen graphite (lấy từ INS: glass-black.css + theme-kinh.css "kinh-den").
   Dải sáng lướt qua bề mặt thẻ theo nhịp thưa (dashShimmerSweep của INS, giãn nhịp). */
:root{
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#eceef3; --bg-a:rgba(255,255,255,.9); --bg-b:rgba(203,213,225,.55); --bg-c:rgba(16,185,129,.07);
  --facet-a:#ffffff; --facet-b:#eef0f5; --facet-c:#e3e6ed; --facet-line:rgba(15,23,42,.05); --facet-sheen:rgba(255,255,255,.9); --vignette:rgba(148,163,184,.18);
  --surface:#ffffff; --card2:rgba(15,23,42,.045); --hdr:rgba(244,246,250,.78); --hdr-solid:#f1f3f7; --tabbar:rgba(255,255,255,.72);
  --glass:linear-gradient(150deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  --line:rgba(15,23,42,.08); --hi:rgba(255,255,255,.95);
  --shadow:0 1px 1px rgba(15,23,42,.04),0 10px 30px -14px rgba(15,23,42,.22);
  --sheen:rgba(255,255,255,.95); --sheen-blend:soft-light; --blur:blur(20px) saturate(150%);
  --ink:#121419; --ink2:#2f3542; --muted:#6b7280;
  --brand:#0b7a55; --accent:#2563eb;
  --pri-bg:linear-gradient(135deg,#18a874,#0b7a55); --pri-ink:#fff; --pri-line:rgba(255,255,255,.35);
  --hero:linear-gradient(135deg,#0b7a55 0%,#14a06e 55%,#2cb67d 100%); --hero-line:rgba(255,255,255,.18);
  --scene:linear-gradient(180deg,#e7edf6 0%,rgba(255,255,255,.92) 72%); --scene-top:#e7edf6;
  --sun:#f29d0b; --sun-soft:#fff1d6; --home:#2f7cf6; --home-soft:#e3edff;
  --bat:#13a15a; --bat-soft:#dcf5e7; --grid:#5b4ff0; --grid-soft:#e8e6ff;
  --v:#2563eb; --w:#e5484d; --e:#d98500; --ok:#13a15a; --off:#9aa3b2; --danger:#e5484d; --danger-soft:#fde6e6; --warn:#f59e0b;
  --tile-top:#9bd67f; --tile-top2:#6cbb58; --tile-l:#5c9a45; --tile-r:#4c843a; --bush:#3f8f3a;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0e; --bg-a:#23232a; --bg-b:#1b1b21; --bg-c:rgba(255,255,255,.02);
  --facet-a:#2a2a31; --facet-b:#15151a; --facet-c:#0e0e12; --facet-line:rgba(255,255,255,.05); --facet-sheen:rgba(255,255,255,.16); --vignette:rgba(0,0,0,.65);
  --surface:#1b1b21; --card2:rgba(255,255,255,.06); --hdr:rgba(14,14,18,.72); --hdr-solid:#0e0e12; --tabbar:rgba(20,20,26,.78);
  --glass:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
  --line:rgba(255,255,255,.14); --hi:rgba(255,255,255,.16);
  --shadow:0 14px 40px -18px rgba(0,0,0,.75); --sheen:rgba(255,255,255,.16); --sheen-blend:screen; --blur:blur(22px) saturate(140%);
  --ink:#f4f4f6; --ink2:#d9d9de; --muted:rgba(235,235,240,.6);
  --brand:#f4f4f6; --accent:#c9d8ff;
  --pri-bg:linear-gradient(100deg,#5c5c68 0%,#3b3b45 55%,#2a2a32 100%); --pri-ink:#fff; --pri-line:rgba(255,255,255,.38);
  --hero:linear-gradient(135deg,#4b4b56 0%,#2e2e36 48%,#1a1a1f 100%); --hero-line:rgba(255,255,255,.16);
  --scene:radial-gradient(120% 90% at 50% 0%,#2b2b33 0%,#18181d 62%,#121216 100%); --scene-top:#2a2a32;
  --sun:#f5b544; --sun-soft:rgba(245,181,68,.15); --home:#83b4ff; --home-soft:rgba(131,180,255,.14);
  --bat:#55d98f; --bat-soft:rgba(85,217,143,.14); --grid:#aaa6ff; --grid-soft:rgba(170,166,255,.15);
  --v:#93b8ff; --w:#ff7b7e; --e:#f5b544; --ok:#55d98f; --off:#6b6b75; --danger:#ff7b7e; --danger-soft:rgba(255,123,126,.14);
  --tile-top:#5d8c50; --tile-top2:#477a3d; --tile-l:#33592c; --tile-r:#2a4a25; --bush:#2f6a2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0e; --bg-a:#23232a; --bg-b:#1b1b21; --bg-c:rgba(255,255,255,.02);
  --facet-a:#2a2a31; --facet-b:#15151a; --facet-c:#0e0e12; --facet-line:rgba(255,255,255,.05); --facet-sheen:rgba(255,255,255,.16); --vignette:rgba(0,0,0,.65);
  --surface:#1b1b21; --card2:rgba(255,255,255,.06); --hdr:rgba(14,14,18,.72); --hdr-solid:#0e0e12; --tabbar:rgba(20,20,26,.78);
  --glass:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
  --line:rgba(255,255,255,.14); --hi:rgba(255,255,255,.16);
  --shadow:0 14px 40px -18px rgba(0,0,0,.75); --sheen:rgba(255,255,255,.16); --sheen-blend:screen; --blur:blur(22px) saturate(140%);
  --ink:#f4f4f6; --ink2:#d9d9de; --muted:rgba(235,235,240,.6);
  --brand:#f4f4f6; --accent:#c9d8ff;
  --pri-bg:linear-gradient(100deg,#5c5c68 0%,#3b3b45 55%,#2a2a32 100%); --pri-ink:#fff; --pri-line:rgba(255,255,255,.38);
  --hero:linear-gradient(135deg,#4b4b56 0%,#2e2e36 48%,#1a1a1f 100%); --hero-line:rgba(255,255,255,.16);
  --scene:radial-gradient(120% 90% at 50% 0%,#2b2b33 0%,#18181d 62%,#121216 100%); --scene-top:#2a2a32;
  --sun:#f5b544; --sun-soft:rgba(245,181,68,.15); --home:#83b4ff; --home-soft:rgba(131,180,255,.14);
  --bat:#55d98f; --bat-soft:rgba(85,217,143,.14); --grid:#aaa6ff; --grid-soft:rgba(170,166,255,.15);
  --v:#93b8ff; --w:#ff7b7e; --e:#f5b544; --ok:#55d98f; --off:#6b6b75; --danger:#ff7b7e; --danger-soft:rgba(255,123,126,.14);
  --tile-top:#5d8c50; --tile-top2:#477a3d; --tile-l:#33592c; --tile-r:#2a4a25; --bush:#2f6a2c; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
html{touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);font-feature-settings:"tnum" 1,"cv11" 1;font-variant-numeric:tabular-nums;min-height:100vh;-webkit-font-smoothing:antialiased;touch-action:manipulation}
html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease,stroke .45s ease!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr-solid)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
/* ---------- nền: khối kính có vân sáng trôi chậm (gb-bg của INS) ---------- */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(1200px 700px at 20% 0%,var(--bg-a) 0%,transparent 60%),radial-gradient(900px 600px at 90% 100%,var(--bg-b) 0%,transparent 60%),radial-gradient(700px 500px at 60% 40%,var(--bg-c) 0%,transparent 62%),var(--bg)}
.bgfx i{position:absolute;background:linear-gradient(135deg,var(--facet-a) 0%,var(--facet-b) 55%,var(--facet-c) 100%);box-shadow:inset 0 0 0 1px var(--facet-line);animation:gbDrift 16s ease-in-out infinite alternate}
.bgfx i::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,var(--facet-sheen) 49%,transparent 52%,transparent 60%);mix-blend-mode:screen}
.bgfx .f1{width:46%;height:42%;left:-6%;top:6%;clip-path:polygon(0 18%,62% 0,100% 40%,38% 100%,0 78%)}
.bgfx .f2{width:40%;height:46%;right:-4%;top:-6%;clip-path:polygon(20% 0,100% 12%,82% 100%,0 70%);animation-duration:21s;animation-direction:alternate-reverse}
.bgfx .f3{width:52%;height:38%;left:26%;bottom:-8%;clip-path:polygon(0 40%,70% 0,100% 52%,58% 100%,8% 90%);animation-duration:18s}
.bgfx .f4{width:30%;height:34%;left:2%;bottom:4%;clip-path:polygon(30% 0,100% 30%,70% 100%,0 62%);animation-duration:24s;animation-direction:alternate-reverse}
.bgfx .f5{width:28%;height:30%;right:6%;bottom:8%;clip-path:polygon(0 20%,80% 0,100% 70%,24% 100%);animation-duration:20s}
.bgfx .vg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,var(--vignette) 100%)}
@keyframes gbDrift{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(14px,-10px,0) rotate(1.2deg)}}
/* ---------- bề mặt kính + dải sáng lướt ---------- */
.glass,.card,.qc,.sc,.scene,details.grp,.empty{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.card,.qc,.sc,.scene,.hero,details.grp,.gb-card{position:relative;overflow:hidden;isolation:isolate}
.card::after,.qc::after,.sc::after,.scene::after,.hero::after,.gb-card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:3;
  background:linear-gradient(115deg,transparent 38%,var(--sheen) 50%,transparent 62%);background-size:260% 100%;background-position:140% 0;
  animation:sheen 11s cubic-bezier(.45,0,.2,1) infinite;animation-delay:var(--sd,1.2s);mix-blend-mode:var(--sheen-blend,normal)}
@keyframes sheen{0%{background-position:140% 0}13%{background-position:-40% 0}100%{background-position:-40% 0}}
.qc:nth-child(2),.sc:nth-child(2){--sd:1.6s}.qc:nth-child(3),.sc:nth-child(3){--sd:2s}.qc:nth-child(4),.sc:nth-child(4){--sd:2.4s}
.sc:nth-child(5){--sd:2.8s}.sc:nth-child(6){--sd:3.2s}.sc:nth-child(n+7){--sd:3.6s}
.scene{--sd:.4s}.hero{--sd:.2s}.card.mt{--sd:2.2s}
@media (prefers-reduced-motion:reduce){.card::after,.qc::after,.sc::after,.scene::after,.hero::after,.gb-card::after,.bgfx i{animation:none}}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
/* ---------- chuyển trang trượt mượt ---------- */
.view{animation:viewIn .42s cubic-bezier(.2,.8,.2,1) both}
.view.from-r{--vx:34px}.view.from-l{--vx:-34px}
@keyframes viewIn{from{opacity:0;transform:translate3d(var(--vx,0),10px,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
/* ---------- header kính ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line);padding-block:10px 12px}
.top .wrap{display:grid;grid-template-columns:minmax(44px,auto) minmax(0,1fr) minmax(44px,auto);align-items:center;gap:8px} /* SỬA (07/11/2026): cột phải giãn được khi có 2 nút */
.top h1{margin:0;font-size:17.5px;font-weight:800;letter-spacing:-.015em;text-align:center;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600;box-shadow:inset 0 1px 0 var(--hi)}
.sub{display:flex;justify-content:center;margin-top:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.dot.online{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent),0 0 10px var(--ok)}
.dot.alarm{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 22%,transparent),0 0 10px var(--danger)}
.icobtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);color:var(--ink2);transition:transform .25s cubic-bezier(.7,0,.2,1),background .2s}
.icobtn:hover{transform:translateY(-1px)}
.icobtn:active{transform:scale(.94)}
.icobtn svg{width:21px;height:21px}
.icobtn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.thm svg{transition:transform .6s cubic-bezier(.7,0,.2,1)}
.thm:hover svg{transform:rotate(-25deg)}
/* ---------- thẻ ---------- */
.card{border-radius:var(--r);padding:16px}
.mt{margin-top:12px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--card2);color:var(--muted);border:1px solid transparent}
.tag.b{background:var(--home-soft);color:var(--home)}
.tag.g{background:var(--bat-soft);color:var(--bat)}
.tag.r{background:var(--danger-soft);color:var(--danger)}
.tag.y{background:var(--sun-soft);color:var(--e)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
/* ---------- sơ đồ năng lượng ---------- */
.scene{background:var(--scene);border-radius:var(--r)}
.scene svg{display:block;width:100%;height:auto;position:relative;z-index:1}
.scene-sw{position:relative;z-index:4;display:flex;justify-content:center;gap:4px;padding:10px 10px 0}
.scene-sw button{font-size:12px;font-weight:600;color:var(--muted);padding:5px 12px;border-radius:99px;border:1px solid transparent;transition:background .3s,color .3s,border-color .3s}
.scene-sw button.on{color:var(--ink);background:var(--glass);border-color:var(--line);box-shadow:inset 0 1px 0 var(--hi)}
.scene.full .scene-sw{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:3px;border-radius:99px;background:var(--hdr);border:1px solid var(--line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);white-space:nowrap}
.scene.full svg{border-radius:inherit}
.scene.swap svg{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}
.ess-glow,.lamp-glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.12}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.pulse,.ess-glow,.lamp-glow{animation:none}}
/* MỚI (31/10/2026): thời tiết khu vực trên sơ đồ ngôi nhà */
.wx-cloud{animation:wxDrift linear infinite}
@keyframes wxDrift{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.wx-drop{animation:wxRain linear infinite}
@keyframes wxRain{from{transform:translate(0,0)}to{transform:translate(-22px,460px)}}
.wx-flash{animation:wxFlash 7s infinite}
@keyframes wxFlash{0%,90%,93.5%,100%{opacity:0}91%{opacity:.55}92%{opacity:.08}93%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.wx-cloud,.wx-drop,.wx-flash{animation:none}.wx-drop{display:none}}
.flow-base{fill:none;stroke-width:7;stroke-linecap:round;opacity:.2}
.flow-anim{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:2 11;animation:flow 1s linear infinite;filter:drop-shadow(0 0 3px currentColor)}
.flow-anim.rev{animation-direction:reverse}
.flow-anim.idle{animation:none;opacity:.25;filter:none}
@keyframes flow{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.flow-anim{animation:none}}
/* ---------- 4 thẻ ---------- */
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:700px){.quad{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qc{border-radius:18px;padding:10px 10px 8px;min-width:0}
/* SỬA (07/11/2026): thu nhỏ chữ/số 4 thẻ cho bằng nhãn trong sơ đồ, nhãn + giá trị cùng 1 dòng → trang ngắn hơn */
.qc .hd{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;line-height:1.2}
.qc .ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 var(--hi)}
.qc .ic svg{width:15px;height:15px}
.qc .big{font-size:18px;font-weight:800;text-align:center;margin:4px 0 4px;letter-spacing:-.02em}
.qc .big small{font-size:11.5px;font-weight:600;margin-left:2px;color:var(--muted)}
.kv{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:2px}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);min-width:0}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--muted);font-size:10.5px;flex:none;white-space:nowrap}
.kv b{text-align:right;font-weight:700;font-size:11.5px;overflow-wrap:anywhere;min-width:0}
.cv{color:var(--v)} .cw{color:var(--w)} .ce{color:var(--e)} .cg{color:var(--bat)}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.gauge svg{width:100%;max-width:72px;height:auto}
.gauge .lb{font-weight:600;font-size:11px;margin-top:0}
.estrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:600px){.estrip{grid-template-columns:repeat(6,minmax(0,1fr))}}
.echip{background:var(--card2);border-radius:12px;padding:6px 8px;border:1px solid var(--line)}
.echip span{display:block;font-size:10.5px;color:var(--muted)}
.echip b{font-size:13.5px;font-weight:800}
.echip small{font-size:10px}
.estrip.rev{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.estrip.rev .echip{padding:6px}
.estrip.rev b{font-size:12.5px;white-space:nowrap}
.ov .card{padding:12px}
.ov .card h3{font-size:13.5px;margin:0 0 8px}
.ov .quad{gap:8px;margin-top:10px}
.ov .mt{margin-top:10px}
.ov .prow{padding:5px 0;font-size:12px}
#sv>.ov~.card{padding:12px;margin-top:10px}
#sv>.ov~.card h3{font-size:13.5px;margin:0 0 6px}
#sv>.ov~.card .alrow,#sv>.ov~.card p{font-size:12px}
/* ---------- thanh tab kính + gạch sáng trượt ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar .wrap{pointer-events:auto}
.tabs{position:relative;display:flex;gap:2px;padding:6px;border-radius:26px;background:var(--tabbar);border:1px solid var(--line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 18px 40px -16px rgba(0,0,0,.45),inset 0 1px 0 var(--hi)}

const SHARE = (location.pathname.match(/^\/s\/([a-z0-9]{12,})/) || [])[1] || null;
const PREVIEW = !!window.__PREVIEW__;
async function api(path, opt = {}) {
  if (PREVIEW) return window.__mock(path, opt);
  const r = await fetch(path, { ...opt, headers: { "Content-Type": "application/json", "X-Req": "1", ...(opt.headers || {}) }, credentials: "same-origin" });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.includes("/login") && !SHARE) { go("#/login"); throw new Error("401"); }
  if (!r.ok) throw new Error(d.error || "Lỗi " + r.status);
  return d;
}

// ---- Giao diện sáng / tối (nhớ theo máy) ----
function curTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
const themeBtn = () => `<button class="icobtn thm" data-theme-toggle aria-label="Đổi giao diện sáng / tối">${ico(curTheme() === "dark" ? "sun" : "moon")}</button>`;
function toggleTheme() {
  const next = curTheme() === "dark" ? "light" : "dark", h = document.documentElement;
  h.classList.add("theme-anim");
  h.setAttribute("data-theme", next);
  try { localStorage.setItem("imTheme", next); } catch {}
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = next === "dark" ? "#0e0e12" : "#f1f3f7";
  document.querySelectorAll("[data-theme-toggle]").forEach((b) => (b.innerHTML = ico(next === "dark" ? "sun" : "moon")));
  setTimeout(() => h.classList.remove("theme-anim"), 520);
  if (/history/.test(location.hash) && $("#hc")) viewHistory();
}
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-theme-toggle]")) toggleTheme();
  const gm = e.target.closest("[data-gbmode]");
  if (gm) $("#gbCard")?.setAttribute("data-mode", gm.dataset.gbmode);
});

// ---- Thanh tab kính, gạch sáng trượt theo mục ----
function placeInd(instant) {
  const a = $("#tabs .tab.on"), ind = $("#tabs .tab-ind");
  if (!a || !ind) return;
  if (instant) ind.style.transition = "none";
  ind.style.width = a.offsetWidth + "px";
  ind.style.transform = `translateX(${a.offsetLeft - 6}px)`;
  if (instant) { void ind.offsetWidth; ind.style.transition = ""; }
}
function setTabs(items, active) {
  const bar = $("#tabbar"), tabs = $("#tabs");
  if (!items) { bar.classList.add("hidden"); tabs.dataset.key = ""; return; }
  bar.classList.remove("hidden");
  const key = items.map((x) => x[0]).join("|");
  let fresh = false;
  if (tabs.dataset.key !== key) {
    tabs.dataset.key = key; fresh = true;
    tabs.innerHTML = `<span class="tab-ind"></span>` + items.map(([h, icon, label]) => `<a class="tab" href="${h}" data-h="${h}">${ico(icon)}<span>${label}</span></a>`).join("");
  }
  tabs.querySelectorAll(".tab").forEach((a) => a.classList.toggle("on", a.dataset.h === active));
  placeInd(fresh);
}
window.addEventListener("resize", () => placeInd(true));

function viewCls(group, idx) {
  const p = S.lastView;
  S.lastView = { group, idx };
  if (!p || p.group !== group || p.idx === idx) return "view";
  return "view " + (idx > p.idx ? "from-r" : "from-l");
}
function header(title, sub, left = "", right = "") {

}

async function render() {
  stopTimer();

// Nút Google / Apple (chỉ hiện khi chủ hệ thống đã cấu hình). link=true: gắn vào tài khoản đang đăng nhập
async function setupOAuth(link, done) {
  if (PREVIEW) return;
  const c = await api("/api/auth/config");
  const onTok = async (path, body) => {
    try {
      const r = await api(path, { method: "POST", body: JSON.stringify(body) });
      if (link) { toast("Đã liên kết"); done?.(); } else loginWelcome(r.user?.name);
    } catch (x) { if (link) toast(x.message); else { $("#leT").textContent = x.message; $("#le").classList.remove("hidden"); } }
  };
  if (c.google_client_id && $("#gBtn")) {
    await loadScript("https://accounts.google.com/gsi/client");
    google.accounts.id.initialize({ client_id: c.google_client_id, callback: (r) => onTok("/api/auth/google", { credential: r.credential }), ux_mode: "popup" });
    google.accounts.id.renderButton($("#gBtn"), { theme: curTheme() === "dark" ? "filled_black" : "outline", size: "large", shape: "pill", text: link ? "signin_with" : "continue_with", locale: "vi", width: 300 });
    $("#oauth")?.classList.remove("hidden");
  }
  if (c.apple_service_id && $("#appleid-signin")) {
    $("#appleid-signin").classList.remove("hidden");
    await loadScript("https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/vi_VN/appleid.auth.js");
    AppleID.auth.init({ clientId: c.apple_service_id, scope: "name email", redirectURI: location.origin + "/", usePopup: true });
    if (!window.__appleEv) {
      window.__appleEv = true;
      document.addEventListener("AppleIDSignInOnSuccess", (e) => S.appleCb?.(e.detail.authorization.id_token));
      document.addEventListener("AppleIDSignInOnFailure", (e) => { if (e.detail?.error !== "popup_closed_by_user") toast("Apple: " + (e.detail?.error || "lỗi")); });
    }
    S.appleCb = (tok) => onTok("/api/auth/apple", { id_token: tok });
    $("#oauth")?.classList.remove("hidden");
  }
}

// ---- Kiểu 2: Ngôi nhà — ảnh render 3D (Blender, tools/blender/house_scene.py), ngày/đêm theo giờ thật ----
// SỬA (31/10/2026): thay hình vẽ tay bằng ảnh render; đường năng lượng + số liệu vẽ chồng theo điểm neo 3D→2D.
function scene2(d, status) {
  const pv = d.pv.power, load = d.load.power, grid = d.grid.power, bat = d.battery.power;
  const night = !isDay(), dark = curTheme() === "dark", A = HOUSE_ANCH, W = 420, H = 366, OY = 58, VH = H + OY;
  const xy = (p) => [+(p[0] * W).toFixed(1), +(p[1] * H + OY).toFixed(1)];
  const line = (pts) => "M" + pts.map((p) => xy(p).join(" ")).join(" L");
  const h = hourNow(), wx = wxInfo(S.weather), gl = wx?.gloom || 0;
  let [skyA, skyB] = skyAt(h, dark);
  if (gl) { skyA = mixHex(skyA, night ? "#151b27" : "#7d8896", gl * (night ? 0.6 : 0.85)); skyB = mixHex(skyB, night ? "#262d3b" : "#c3cad3", gl * (night ? 0.6 : 0.85)); }
  const glass = night || dark, tc = glass ? "#f4f4f6" : "#14161c", mc = glass ? "rgba(235,235,240,.72)" : "#5b6270", bg = glass ? "rgba(14,16,22,.74)" : "rgba(255,255,255,.88)";
  const label = (x, y, color, val, sub, anchor = "middle") => {

    return `<g><rect x="${x0}" y="${y - 17}" width="${w}" height="34" rx="12" fill="${bg}" stroke="${color}" stroke-opacity=".7"/>
      <circle cx="${x0 + 12}" cy="${y - 4}" r="3.6" fill="${color}"/>
      ${T(x0 + 21, y + 0.5, val, { a: "start", s: 13, w: 800, c: tc })}${T(x0 + 21, y + 12, sub, { a: "start", s: 9.5, w: 600, c: mc })}</g>`;
  };
  // MỚI (31/10/2026): mặt trời / mặt trăng chạy theo giờ thật (mọc bên phải = hướng Đông, lặn bên trái), khuất sau đồi khi thấp
  const HZ = OY + 0.2 * H, arc = (t) => [W * (0.93 - 0.86 * t), HZ - (HZ - 70) * Math.sin(Math.PI * t)];
  const sunT = (h - 6) / 12, sunUp = sunT > -0.02 && sunT < 1.02;
  let sunSvg = "";
  if (sunUp) {
    const [sx, sy] = arc(Math.max(0, Math.min(1, sunT))), low = Math.max(0, 1 - Math.sin(Math.PI * Math.max(0, Math.min(1, sunT))) * 2.2);
    const core = low > 0.5 ? "#fb923c" : low > 0.15 ? "#fbbf24" : "#fcd34d";
    sunSvg = gl > 0.9 ? "" : `<g opacity="${(1 - gl * 0.9).toFixed(2)}"><defs><radialGradient id="sunHalo"><stop offset="0" stop-color="${core}" stop-opacity=".55"/><stop offset=".45" stop-color="${core}" stop-opacity=".18"/><stop offset="1" stop-color="${core}" stop-opacity="0"/></radialGradient></defs>
      <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${(34 + low * 14).toFixed(1)}" fill="url(#sunHalo)"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="11" fill="${core}"/></g>`;
  }
  // mặt trăng: mọc lúc chạng vạng bên phải, lặn lúc rạng sáng bên trái; hình dạng theo pha trăng thật hôm nay
  const ph = Math.min(0.94, Math.max(0.06, moonPhase())), moonT = (((h - 17.8) % 24) + 24) % 24 / 12.4;
  let moonSvg = "";
  if (moonT > 0 && moonT < 1) {
    const [mx, my] = arc(moonT), r = 9.5, k = Math.cos(2 * Math.PI * ph), wax = ph < 0.5, rxT = (Math.abs(k) * r).toFixed(2);
    const s2 = wax ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
    const lit = `M${mx.toFixed(1)} ${(my - r).toFixed(1)} A${r} ${r} 0 0 ${wax ? 1 : 0} ${mx.toFixed(1)} ${(my + r).toFixed(1)} A${rxT} ${r} 0 0 ${s2} ${mx.toFixed(1)} ${(my - r).toFixed(1)}Z`;
    moonSvg = gl > 0.9 ? "" : `<g opacity="${((night ? 1 : 0.55) * (1 - gl * 0.9)).toFixed(2)}"><circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${r * 2.4}" fill="#e2e8f0" opacity="${night ? 0.12 : 0}"/><circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${r}" fill="#94a3b8" opacity=".18"/><path d="${lit}" fill="#f1f5f9"/></g>`;
  }
  // ảnh nền: trộn 2 khung giờ gần nhất để bóng đổ dịch chuyển dần; 18–19h chuyển dần sang đêm, 5–6h chuyển dần sang ngày
  const pad = (n) => String(n).padStart(2, "0");
  let fa = "night", fb = null, ff = 0;
  if (h >= 6 && h <= 18) { const a = Math.floor(h); fa = pad(a); fb = a < 18 ? pad(a + 1) : null; ff = h - a; }
  else if (h > 18 && h < 19) { fa = "18"; fb = "night"; ff = h - 18; }
  else if (h >= 5 && h < 6) { fa = "night"; fb = "06"; ff = h - 5; }
  const imgs = `<image href="${houseImg(fa)}" x="0" y="${OY}" width="${W}" height="${H}" preserveAspectRatio="none"/>` + (fb && ff > 0.02 ? `<image href="${houseImg(fb)}" x="0" y="${OY}" width="${W}" height="${H}" preserveAspectRatio="none" opacity="${ff.toFixed(3)}"/>` : "");
  const starO = Math.max(0, Math.min(1, h < 12 ? (5.6 - h) / 0.8 : (h - 18.4) / 0.8)) * (1 - gl);

    for (let i = 0; i < n; i++) {

      clouds += `<g class="wx-cloud" style="animation-duration:${dur}s;animation-delay:${del.toFixed(1)}s"><g transform="translate(0 ${y0}) scale(${sc.toFixed(2)})" opacity="${op}">
        <ellipse cx="2" cy="13" rx="48" ry="12" fill="${cs}"/><circle cx="-16" cy="2" r="15" fill="${cf}"/><circle cx="10" cy="-4" r="20" fill="${cf}"/><circle cx="32" cy="5" r="12" fill="${cf}"/><ellipse cx="0" cy="9" rx="44" ry="10" fill="${cf}"/></g></g>`;
    }
    if (wx.wet) {
      const nd = Math.round(60 + wx.wet * 110);
      for (let i = 0; i < nd; i++) {
        const x = (i * 97.3) % (W + 40), y = (i * 53.7) % 460, dur = 0.55 + ((i * 7) % 5) / 12;
        rain += `<line class="wx-drop" x1="${x.toFixed(0)}" y1="${(y - 460).toFixed(0)}" x2="${(x - 4).toFixed(0)}" y2="${(y - 460 + 18).toFixed(0)}" stroke="${night ? "#9fb3cf" : "#e8f0fa"}" stroke-opacity="${(0.3 + wx.wet * 0.3).toFixed(2)}" stroke-width=".9" stroke-linecap="round" style="animation-duration:${dur.toFixed(2)}s;animation-delay:-${((i * 0.137) % dur).toFixed(2)}s"/>`;
      }
    }
    if (gl > 0.05) veil += `<rect y="${OY}" width="${W}" height="${H}" fill="${night ? "#05070d" : "#1e293b"}" opacity="${(gl * (night ? 0.25 : 0.32)).toFixed(2)}" style="mix-blend-mode:multiply"/>`;
    if (wx.k === "fog") veil += `<rect width="${W}" height="${VH}" fill="#e5e7eb" opacity="${night ? 0.12 : 0.32}"/>`;
    if (wx.k === "storm") veil += `<rect class="wx-flash" width="${W}" height="${VH}" fill="#f8fafc" opacity="0"/>`;
  }
  // thẻ thời tiết + tỉ lệ phát (góc trên trái)
  const ratio = pvRatio(pv);
  const wxChip = wx || ratio !== null ? `<g><rect x="8" y="${OY - 2}" width="${wx ? 128 : 96}" height="36" rx="12" fill="${bg}" stroke="${glass ? "rgba(255,255,255,.14)" : "rgba(15,23,42,.08)"}"/>
    ${wx ? wxIcon(wx.k, 27, OY + 15, 24, night) : ""}
    ${T(wx ? 44 : 18, OY + 13, wx ? wx.t + (isNum(wx.temp) ? " · " + Math.round(wx.temp) + "°" : "") : "Tỉ lệ phát", { a: "start", s: 10.5, w: 800, c: tc })}
    ${T(wx ? 44 : 18, OY + 27, ratio !== null ? "Phát " + Math.round(ratio) + "% công suất" : isNum(wx?.rad) ? "Bức xạ " + Math.round(wx.rad) + " W/m²" : "", { a: "start", s: 9, w: 600, c: mc })}</g>` : "";
  const stars = starO > 0 ? [[24, 22], [70, 12], [128, 34], [190, 16], [262, 30], [300, 12], [352, 26], [398, 14], [110, 52], [228, 48]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 0.9 : 1.4}" fill="#fff" opacity="${((0.45 + (i % 3) * 0.2) * starO).toFixed(2)}"/>`).join("") : "";
  const sky = moonSvg + sunSvg;
  // màn hình tròn trên pin: hiện SOC thật
  const [dx, dy] = xy(A.ess_disp[0]), rx = Math.hypot(...xy(A.ess_disp[1]).map((v, i) => v - [dx, dy][i])), ry = Math.hypot(...xy(A.ess_disp[2]).map((v, i) => v - [dx, dy][i]));
  const s = isNum(d.battery.soc) ? Math.max(0, Math.min(100, d.battery.soc)) : 0, C = 2 * Math.PI * Math.max(rx, 0.5) * 0.8;
  const disp = `<ellipse cx="${dx}" cy="${dy}" rx="${rx}" ry="${ry}" fill="#081120"/><ellipse cx="${dx}" cy="${dy}" rx="${rx * 0.8}" ry="${ry * 0.8}" fill="none" stroke="${s < 20 ? "#f59e0b" : "#38e1ff"}" stroke-width="${Math.max(0.5, rx * 0.18)}" stroke-dasharray="${((C * s) / 100).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 ${dx} ${dy})"/>`;

    ${essArt(cx + 9, cy + 9, 40, d.battery.soc, bat)}
    ${T(cx + 58, cy + 22, "Pin lưu trữ", { a: "start", s: 10, w: 700, c: mc })}

// ================= Cài đặt =================
const SET_ORDER = ["Work Mode", "Time of Use", "Settings", "Grid Parameters", "BMS", "Control", "Parameters"];
function settingDisplay(s) {
  const v = s.value;
  if (v === null || v === undefined) return "--";
  if (s.platform === "switch") return switchOn(s) ? "Bật" : "Tắt";
  if (s.platform === "select") return viOpt(v);
  if (typeof v === "number") return nf(v, 2) + (s.uom ? " " + s.uom : "");
  return String(v);
}
function switchOn(s) {
  const v = Number(s.value);
  if (!Number.isFinite(v)) return false;
  return s.bit !== null && s.bit !== undefined ? ((v >> s.bit) & 1) === 1 : v !== s.off;
}
async function viewSettings() {
  const draw = () => {
    const el = $("#sv"); if (!el) return;
    const d = S.detail;
    if (!d) { el.innerHTML = `<div class="empty">Chưa có dữ liệu.${S.detailErr ? "<br><small>" + esc(S.detailErr) + "</small>" : ""}</div>`; return; } // SỬA (31/10/2026): hiện lỗi thật từ cloud
    const sets = d.settings || [];
    const enabled = !!d.settings_enabled && S.online !== false;
    if (!sets.length) {
      el.innerHTML = `<div class="empty">${esc(d.settings_note || "Trạm này chưa hỗ trợ cài đặt từ xa.")}<br><br>Lắp <b>gateway INSOLAR</b> (RS485/CAN) để đọc toàn bộ thông số và cài đặt inverter giống app của hãng.</div>`;
      return;
    }
    const byName = new Map(sets.map((s) => [s.name, s]));
    const progs = [1, 2, 3, 4, 5, 6].map((n) => ({ n, time: byName.get(`Program ${n} Time`), power: byName.get(`Program ${n} Power`), soc: byName.get(`Program ${n} SOC`), volt: byName.get(`Program ${n} Voltage`), chg: byName.get(`Program ${n} Charging`) })).filter((p) => p.time);
    const tou = byName.get("Time of Use");
    const groups = {};
    for (const s of sets) { if (/^Program \d /.test(s.name) || (s.name === "Time of Use" && progs.length)) continue; (groups[s.group] ??= []).push(s); }
    const order = Object.keys(groups).sort((a, b) => ((SET_ORDER.indexOf(a) + 99) % 99) - ((SET_ORDER.indexOf(b) + 99) % 99));
    const pick = ["Work Mode", "Energy Pattern", "Export Surplus", "Export Surplus Power", "Battery Max Charging Current", "Battery Max Discharging Current", "Battery Grid Charging", "Battery Shutdown SOC", "Battery Low SOC", "Battery Restart SOC", "Storage Control Mode", "Backup Mode", "Backup Mode SOC", "Overdischarge SOC", "Force Charge SOC"];
    const quick = pick.map((n) => byName.get(n)).filter(Boolean);
    const row = (s) => `<button class="srow" data-k="${esc(s.key)}" ${enabled && !s.readonly ? "" : "disabled"}><div class="nm"><div>${esc(vi(s.name))}</div>${vi(s.name) !== s.name ? `<small>${esc(s.name)}</small>` : ""}</div><div class="vl">${esc(settingDisplay(s))}</div><span class="chev"></span></button>`;
    el.innerHTML = `${!enabled ? `<div class="note ${S.online === false ? "r" : ""}">${S.online === false ? "Gateway đang ngoại tuyến — không gửi được lệnh. Đang hiển thị giá trị đọc gần nhất." : esc(d.settings_note || "Gateway đang tắt quyền cài đặt từ xa.")}</div>` : `<div class="note">${!S.st?.gateway_id && d.settings_note ? esc(d.settings_note) + ". " : ""}Mỗi thay đổi được ghi vào inverter và lưu nhật ký. Kiểm tra kỹ trước khi xác nhận.</div>`}
      ${quick.length ? `<div class="card mt"><h3>${ico("bolt", 'style="width:20px;height:20px;color:var(--sun)"')} Cài đặt nhanh</h3>${quick.map(row).join("")}</div>` : ""}
      ${progs.length ? `<div class="card mt"><h3>${ico("chart", 'style="width:20px;height:20px;color:var(--grid)"')} Lịch sạc xả theo giờ ${tou ? `<button class="tag b" data-k="${esc(tou.key)}" ${enabled ? "" : "disabled"}>${esc(settingDisplay(tou))}</button>` : ""}</h3>
        <div class="scrollx"><table class="tou"><tr><th>Mốc</th><th>Từ giờ</th><th>Công suất</th><th>${progs[0].soc ? "SOC" : "Điện áp"}</th><th>Sạc từ</th></tr>
        ${progs.map((p) => `<tr><td>${p.n}</td><td><button data-k="${esc(p.time.key)}" ${enabled ? "" : "disabled"}>${esc(p.time.value ?? "--")}</button></td>
          <td>${p.power ? `<button data-k="${esc(p.power.key)}" ${enabled ? "" : "disabled"}>${isNum(p.power.value) ? nf(p.power.value, 0) + "W" : "--"}</button>` : "--"}</td>
          <td>${(p.soc || p.volt) ? `<button data-k="${esc((p.soc || p.volt).key)}" ${enabled ? "" : "disabled"}>${isNum((p.soc || p.volt).value) ? nf((p.soc || p.volt).value, 1) + (p.soc ? "%" : "V") : "--"}</button>` : "--"}</td>
          <td>${p.chg ? `<button data-k="${esc(p.chg.key)}" ${enabled ? "" : "disabled"}>${esc(viOpt(p.chg.value) ?? "--")}</button>` : "--"}</td></tr>`).join("")}</table></div>
        <p class="small muted" style="margin:6px 0 0">Mỗi mốc áp dụng từ giờ ghi đến giờ của mốc kế tiếp.</p></div>` : ""}
      ${order.map((g) => `<details class="grp"><summary>${esc(viGroup(g))}<span class="tag">${groups[g].length}</span></summary><div class="in">${groups[g].map(row).join("")}</div></details>`).join("")}
      ${!SHARE ? `<div class="card mt"><h3>Nhật ký lệnh</h3><div id="clog"><div class="skel"></div></div></div>` : ""}`;
    el.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => { const s = sets.find((x) => x.key === b.dataset.k); if (s && enabled) editSetting(s); }));
    loadCmdLog();
  };
  if (!S.detail) { try { await loadDetail(); } catch (e) { $("#sv").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; } }
  draw();
  S.redrawSettings = draw;
}
async function loadCmdLog() {
  const el = $("#clog"); if (!el) return;
  try {
    const list = await api(`/api/stations/${S.st.id}/commands`);
    el.innerHTML = list.length ? `<div class="plist">${list.slice(0, 15).map((c) => `<div class="prow"><span>${esc(vi(c.name))}${c.value !== null ? ` → <b>${esc(viOpt(c.value))}</b>` : ""}<br><small class="muted">${new Date(c.created_at.replace(" ", "T") + (c.created_at.includes("Z") ? "" : "Z")).toLocaleString("vi-VN")}</small></span>
      <b><span class="tag ${c.status === "ok" ? "g" : c.status === "error" ? "r" : ""}">${c.status === "ok" ? "Thành công" : c.status === "error" ? "Lỗi" : "Đang gửi"}</span></b></div>`).join("")}</div>` : `<p class="muted small" style="margin:0">Chưa có lệnh nào.</p>`;
  } catch { el.innerHTML = ""; }
}
function editSetting(s) {
  let input = "";
  if (s.platform === "number") input = `<div class="field"><label for="sv_in">Giá trị mới ${s.uom ? "(" + esc(s.uom) + ")" : ""}</label><input class="inp" id="sv_in" type="number" inputmode="decimal" step="${s.step}" min="${s.min}" max="${s.max}" value="${isNum(s.value) ? s.value : ""}">
    <p class="small muted" style="margin:6px 0 0">Khoảng cho phép: ${nf(s.min, 2)} – ${nf(s.max, 2)} ${esc(s.uom || "")}</p></div>`;
  else if (s.platform === "select") input = `<div class="field"><label for="sv_in">Chọn</label><select class="inp" id="sv_in">${s.options.map((o) => `<option value="${esc(o)}" ${o === s.value ? "selected" : ""}>${esc(viOpt(o))}</option>`).join("")}</select></div>`;
  else if (s.platform === "switch") input = `<div class="field" style="display:flex;align-items:center;justify-content:space-between"><label style="margin:0;font-size:14px;color:var(--ink)">${esc(vi(s.name))}</label><button class="switch ${switchOn(s) ? "on" : ""}" id="sv_in" role="switch" aria-checked="${switchOn(s)}"></button></div>`;
  else if (s.platform === "time") input = `<div class="field"><label for="sv_in">Giờ</label><input class="inp" id="sv_in" type="time" value="${esc(s.value || "00:00")}"></div>`;
  else if (s.platform === "text") input = `<div class="field"><label for="sv_in">Giá trị mới ${s.hint ? "(" + esc(s.hint) + ")" : ""}</label><input class="inp" id="sv_in" type="text" autocomplete="off" placeholder="${esc(s.hint || "")}" value="${esc(s.value ?? "")}"></div>`;
  else if (s.platform === "datetime") input = `<div class="field"><label for="sv_in">Ngày giờ</label><input class="inp" id="sv_in" type="datetime-local" value="${new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 16)}"></div><p class="small muted">Mặc định là giờ Việt Nam hiện tại.</p>`;
  openSheet(`<h2>${esc(vi(s.name))}</h2><p class="small muted" style="margin:0">${esc(s.name)} · hiện tại: <b>${esc(settingDisplay(s))}</b></p>${input}
    <p class="small" id="sv_err" style="color:var(--danger);min-height:18px"></p>
    <div class="row2"><button class="btn" id="sv_cancel">Huỷ</button><button class="btn pri" id="sv_ok">Ghi vào inverter</button></div>`);
  const sw = $("#sv_in");
  if (s.platform === "switch") sw.onclick = () => { sw.classList.toggle("on"); sw.setAttribute("aria-checked", sw.classList.contains("on")); };
  $("#sv_cancel").onclick = closeSheet;
  $("#sv_ok").onclick = async () => {
    let value;
    if (s.platform === "switch") value = sw.classList.contains("on") ? "on" : "off";
    else if (s.platform === "number") { value = Number(sw.value); if (!Number.isFinite(value) || value < s.min || value > s.max) { $("#sv_err").textContent = `Giá trị phải từ ${s.min} đến ${s.max}`; return; } }
    else if (s.platform === "text") { value = sw.value.trim(); if (s.pattern && !new RegExp(s.pattern).test(value)) { $("#sv_err").textContent = "Sai định dạng" + (s.hint ? ": " + s.hint : ""); return; } }
    else if (s.platform === "datetime") value = new Date(sw.value + ":00+07:00").toISOString();
    else value = sw.value;
    const btn = $("#sv_ok"); btn.disabled = true; btn.textContent = "Đang gửi…";
    try {
      const r = await api(`/api/stations/${S.st.id}/settings`, { method: "POST", body: JSON.stringify({ key: s.key, value }) });
      if (!r.ok) throw new Error(r.error || "Gateway báo lỗi");
      closeSheet(); toast("Đã ghi: " + vi(s.name));
      setTimeout(async () => { try { await loadDetail(); S.redrawSettings?.(); } catch {} }, 1500);
    } catch (e) { $("#sv_err").textContent = e.message; btn.disabled = false; btn.textContent = "Ghi vào inverter"; }
  };
}

// ================= Sheet chung =================
function openSheet(html) { $("#sheetBody").innerHTML = html; $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", (e) => e.key === "Escape" && closeSheet());
function confirmSheet(title, msg, fn) {

  $("#cf_no").onclick = closeSheet;
  $("#cf_yes").onclick = async () => { const b = $("#cf_yes"); b.disabled = true; try { await fn(); closeSheet(); } catch (e) { $("#cf_err").textContent = e.message; b.disabled = false; } };
}
function stationInfoSheet() {
  const s = S.st;
  openSheet(`<h2>Thông tin trạm</h2>
    <div class="field"><label for="i_cus">Khách hàng</label><input class="inp" id="i_cus" value="${esc(s.customer)}"></div>
    <div class="row2"><div class="field"><label for="i_ph">Điện thoại</label><input class="inp" id="i_ph" inputmode="tel" value="${esc(s.phone)}"></div>
    <div class="field"><label for="i_kwp">Công suất (kWp)</label><input class="inp" id="i_kwp" inputmode="decimal" value="${esc(s.capacity_kwp ?? "")}"></div></div>
    <div class="row2"><div class="field"><label for="i_lat">Vĩ độ</label><input class="inp" id="i_lat" inputmode="decimal" placeholder="19.80" value="${esc(s.lat ?? "")}"></div>
    <div class="field"><label for="i_lon">Kinh độ</label><input class="inp" id="i_lon" inputmode="decimal" placeholder="105.78" value="${esc(s.lon ?? "")}"></div></div>
    <button class="btn full" id="i_gps" type="button">Lấy vị trí hiện tại (đứng tại nhà khách)</button>
    <p class="small muted" style="margin:6px 0 0">Toạ độ dùng để lấy thời tiết khu vực. Để trống sẽ dùng thời tiết TP Thanh Hoá.</p>
    <div class="field"><label for="i_note">Ghi chú</label><textarea class="inp" id="i_note" rows="2">${esc(s.note)}</textarea></div>
    <div class="field"><label>Link xem cho khách</label><div id="i_share"></div></div>
    <div class="row2 mt"><button class="btn" id="i_x">Đóng</button><button class="btn pri" id="i_save">Lưu</button></div>`);
  const drawShare = () => {
    const link = s.share_token ? location.origin + "/s/" + s.share_token : "";
    $("#i_share").innerHTML = link ? `<div class="kpair"><code>${esc(link)}</code><button class="icobtn" id="i_cp" aria-label="Sao chép">${ico("copy")}</button></div><button class="btn dan full mt" id="i_rv">Thu hồi link</button>`
      : `<button class="btn full" id="i_mk">${ico("share")} Tạo link</button>`;
    if (link) {
      $("#i_cp").onclick = () => navigator.clipboard.writeText(link).then(() => toast("Đã sao chép"), () => toast("Hãy chọn và sao chép thủ công"));
      $("#i_rv").onclick = async () => { await api(`/api/stations/${s.id}/share`, { method: "POST", body: '{"revoke":true}' }); s.share_token = null; drawShare(); };
    } else $("#i_mk").onclick = async () => { s.share_token = (await api(`/api/stations/${s.id}/share`, { method: "POST", body: "{}" })).share_token; drawShare(); };
  };
  drawShare();
  $("#i_x").onclick = closeSheet;
  $("#i_gps").onclick = () => {
    if (!navigator.geolocation) return toast("Máy không hỗ trợ định vị");
    navigator.geolocation.getCurrentPosition((p) => { $("#i_lat").value = p.coords.latitude.toFixed(5); $("#i_lon").value = p.coords.longitude.toFixed(5); }, () => toast("Không lấy được vị trí"), { enableHighAccuracy: true, timeout: 15000 });
  };
  $("#i_save").onclick = async () => {
    const b = { customer: $("#i_cus").value, phone: $("#i_ph").value, note: $("#i_note").value, capacity_kwp: $("#i_kwp").value, lat: $("#i_lat").value.trim(), lon: $("#i_lon").value.trim() };
    await api(`/api/stations/${s.id}`, { method: "PATCH", body: JSON.stringify(b) });
    Object.assign(s, b, { capacity_kwp: Number(b.capacity_kwp) || s.capacity_kwp, lat: b.lat === "" ? null : Number(b.lat), lon: b.lon === "" ? null : Number(b.lon) }); closeSheet(); toast("Đã lưu");
  };
}

// ================= Gateway =================
async function renderGateways() {
  setTabs(TOP_TABS, "#/gateways");
  app.innerHTML = `<div class="page">${header("Gateway INSOLAR", `<span class="pill">${ico("gw", 'style="width:14px;height:14px;color:var(--brand)"')} RS485 · CAN · BMS</span>`, themeBtn(), `<button class="icobtn" id="gAdd" aria-label="Thêm gateway">${ico("plus")}</button>`)}
    <div class="wrap ${viewCls("top", 1)}" style="padding-top:12px"><div class="note">Gateway là mạch ESP32 gắn tại nhà khách: đọc inverter qua RS485 (hoặc qua dongle Solarman trong mạng LAN), nghe CAN-H/CAN-L giữa pin và inverter, đọc BMS từng cell, và nhận lệnh cài đặt từ xa.</div>
    <div id="gl" class="slist mt"><div class="spin"></div></div></div></div>`;
  $("#gAdd").onclick = () => gatewayForm();
  if (!S.profiles) S.profiles = await api("/api/profiles").catch(() => []);
  const list = await api("/api/gateways").catch(() => []);
  $("#gl").innerHTML = list.length ? list.map((g) => {
    const online = g.last_seen && Date.now() - new Date(g.last_seen) < 10 * 60e3;
    const prof = S.profiles.find((p) => p.id === g.profile);
    return `<div class="sc"><div class="t"><span class="dot ${online ? "online" : ""}"></span><h4>${esc(g.name)}</h4><span class="tag">${esc(g.id)}</span></div>
      <div class="meta"><span>${esc(prof?.label || g.profile)}</span><span>· ${g.transport === "solarman_v5" ? "Solarman V5 (LAN)" : "RS485"}</span>${g.can_enabled ? "<span>· CAN</span>" : ""}${g.bms_kind ? `<span>· BMS ${esc(g.bms_kind.toUpperCase())}</span>` : ""}</div>
      <div class="meta"><span>${online ? "Trực tuyến" : "Ngoại tuyến"} · ${ago(g.last_seen)}</span>${g.fw ? `<span>· fw ${esc(g.fw)}</span>` : ""}${isNum(g.rssi) ? `<span>· WiFi ${g.rssi} dBm</span>` : ""}${g.allow_write ? "" : "<span>· khóa cài đặt</span>"}</div>
      <div class="row2 mt"><a class="btn" href="#/st/${g.station_id}/overview">Xem trạm</a><button class="btn" data-ed="${esc(g.id)}">Sửa</button></div></div>`;
  }).join("") : `<div class="empty">Chưa có gateway. Bấm <b>+</b> để thêm.</div>`;
  $("#gl").querySelectorAll("[data-ed]").forEach((b) => (b.onclick = () => gatewayForm(list.find((g) => g.id === b.dataset.ed))));
}
function gatewayForm(g) {
  const P0 = g ? JSON.parse(g.params || "{}") : { mppt: 2, phase: 1, pack: 1 };
  const isEdit = !!g; g = g || { transport: "rs485", slave: 1, poll: 10, can_enabled: 1, allow_write: 1, bms_transport: "uart" };
  openSheet(`<h2>${isEdit ? "Sửa gateway" : "Thêm gateway"}</h2>
    <div class="field"><label for="g_name">Tên trạm</label><input class="inp" id="g_name" value="${esc(g.name || "")}" placeholder="Nhà anh Hùng - Sầm Sơn"></div>
    <div class="field"><label for="g_prof">Dòng inverter</label><select class="inp" id="g_prof">${(S.profiles || []).map((p) => `<option value="${p.id}" ${p.id === (g.profile || "deye_hybrid") ? "selected" : ""}>${esc(p.label)}</option>`).join("")}</select></div>
    <div class="row2"><div class="field"><label for="g_mppt">Số MPPT</label><input class="inp" id="g_mppt" type="number" min="1" max="12" value="${P0.mppt ?? 2}"></div>
    <div class="field"><label for="g_phase">Số pha</label><select class="inp" id="g_phase"><option value="1" ${P0.phase == 1 ? "selected" : ""}>1 pha</option><option value="2" ${P0.phase == 2 ? "selected" : ""}>2 pha (split)</option><option value="3" ${P0.phase == 3 ? "selected" : ""}>3 pha</option></select></div></div>
    <div class="row2"><div class="field"><label for="g_pack">Số pack pin (BMS)</label><input class="inp" id="g_pack" type="number" min="0" max="20" value="${P0.pack ?? 1}"></div>
    <div class="field"><label for="g_slave">Địa chỉ Modbus</label><input class="inp" id="g_slave" type="number" min="1" max="247" value="${g.slave}"></div></div>
    <div class="field"><label for="g_tr">Cách đọc inverter</label><select class="inp" id="g_tr"><option value="rs485" ${g.transport === "rs485" ? "selected" : ""}>Dây RS485 (cổng Modbus/Meter)</option><option value="solarman_v5" ${g.transport === "solarman_v5" ? "selected" : ""}>Qua dongle Solarman trong mạng LAN</option></select></div>
    <div class="row2" id="g_v5" ${g.transport === "solarman_v5" ? "" : 'style="display:none"'}><div class="field"><label for="g_v5h">IP dongle</label><input class="inp" id="g_v5h" value="${esc(g.v5_host || "")}" placeholder="192.168.1.50"></div>
    <div class="field"><label for="g_v5s">Serial dongle</label><input class="inp" id="g_v5s" inputmode="numeric" value="${esc(g.v5_serial || "")}" placeholder="27xxxxxxxx"></div></div>
    <div class="row2"><div class="field"><label for="g_poll">Chu kỳ đọc (giây)</label><input class="inp" id="g_poll" type="number" min="5" max="300" value="${g.poll}"></div>
    <div class="field"><label for="g_bms">BMS đọc từng cell</label><select class="inp" id="g_bms"><option value="">Không</option><option value="jbd" ${g.bms_kind === "jbd" ? "selected" : ""}>JBD / Xiaoxiang</option><option value="daly" ${g.bms_kind === "daly" ? "selected" : ""}>Daly</option></select></div></div>
    <div class="row2"><div class="field"><label for="g_bmst">Kết nối BMS</label><select class="inp" id="g_bmst"><option value="uart" ${g.bms_transport !== "ble" ? "selected" : ""}>UART / RS485</option><option value="ble" ${g.bms_transport === "ble" ? "selected" : ""}>Bluetooth</option></select></div>
    <div class="field"><label for="g_blen">Tên Bluetooth BMS</label><input class="inp" id="g_blen" value="${esc(g.bms_ble_names || "")}" placeholder="LS2319…, xiaoxiang"></div></div>
    ${!isEdit ? `<div class="row2"><div class="field"><label for="g_kwp">Công suất PV (kWp)</label><input class="inp" id="g_kwp" inputmode="decimal"></div><div class="field"><label for="g_cus">Khách hàng</label><input class="inp" id="g_cus"></div></div>` : ""}
    ${[["g_can", "Nghe CAN pin ↔ inverter (CAN-H/CAN-L)", g.can_enabled], ["g_aw", "Cho phép cài đặt từ xa", g.allow_write], ["g_ib", "Đảo dấu công suất pin", g.invert_battery], ["g_ig", "Đảo dấu công suất lưới", g.invert_grid]]
      .map(([id, t, on]) => `<div class="srow" style="cursor:default"><div class="nm"><div>${t}</div></div><button class="switch ${on ? "on" : ""}" id="${id}" role="switch" aria-checked="${!!on}"></button></div>`).join("")}
    <p class="small" id="g_err" style="color:var(--danger);min-height:18px"></p>
    <div class="row2"><button class="btn" id="g_x">Huỷ</button><button class="btn pri" id="g_ok">${isEdit ? "Lưu" : "Tạo gateway"}</button></div>
    ${isEdit ? `<div class="row2 mt"><button class="btn" id="g_rk">Cấp lại khóa</button><button class="btn dan" id="g_del">Xóa</button></div>` : ""}`);
  document.querySelectorAll("#sheet .switch").forEach((b) => (b.onclick = () => { b.classList.toggle("on"); b.setAttribute("aria-checked", b.classList.contains("on")); }));
  $("#g_tr").onchange = (e) => ($("#g_v5").style.display = e.target.value === "solarman_v5" ? "" : "none");
  $("#g_x").onclick = closeSheet;
  const on = (id) => $("#" + id).classList.contains("on");
  $("#g_ok").onclick = async () => {
    const body = { name: $("#g_name").value.trim(), profile: $("#g_prof").value, params: { mppt: Number($("#g_mppt").value), phase: Number($("#g_phase").value), pack: Number($("#g_pack").value) },
      slave: Number($("#g_slave").value), transport: $("#g_tr").value, v5_host: $("#g_v5h").value.trim() || null, v5_serial: $("#g_v5s").value.trim() || null, poll: Number($("#g_poll").value),
      bms_kind: $("#g_bms").value || null, bms_transport: $("#g_bmst").value, bms_ble_names: $("#g_blen").value.trim() || null,
      can_enabled: on("g_can"), allow_write: on("g_aw"), invert_battery: on("g_ib"), invert_grid: on("g_ig") };
    if (!isEdit) { body.capacity_kwp = $("#g_kwp").value; body.customer = $("#g_cus").value; }
    if (!body.name) { $("#g_err").textContent = "Nhập tên trạm"; return; }
    try {
      if (isEdit) { await api(`/api/gateways/${g.id}`, { method: "PATCH", body: JSON.stringify(body) }); closeSheet(); toast("Đã lưu, gateway nhận cấu hình mới"); renderGateways(); }
      else { const r = await api("/api/gateways", { method: "POST", body: JSON.stringify(body) }); showKey(r.id, r.key); renderGateways(); }
    } catch (e) { $("#g_err").textContent = e.message; }
  };
  if (isEdit) {
    $("#g_rk").onclick = () => confirmSheet("Cấp lại khóa", "Gateway đang chạy sẽ bị ngắt cho tới khi nhập khóa mới.", async () => { const r = await api(`/api/gateways/${g.id}/rekey`, { method: "POST" }); setTimeout(() => showKey(g.id, r.key), 300); });
    $("#g_del").onclick = () => confirmSheet("Xóa gateway", "Xóa gateway cùng trạm và toàn bộ lịch sử của nó?", async () => { await api(`/api/gateways/${g.id}`, { method: "DELETE" }); renderGateways(); });
  }
}
function showKey(id, key) {
  const server = location.origin.replace(/^http/, "ws");
  openSheet(`<h2>Thông tin nạp vào gateway</h2><p class="small muted" style="margin-top:0">Khóa chỉ hiện một lần. Nhập 3 dòng này trong trang cấu hình WiFi của ESP32 (phát WiFi tên <b>INSOLAR-GW</b>).</p>
    ${[["Máy chủ", server], ["Gateway ID", id], ["Khóa", key]].map(([k, v]) => `<div class="field"><label>${k}</label><div class="kpair"><code>${esc(v)}</code><button class="icobtn" data-cp="${esc(v)}" aria-label="Sao chép ${k}">${ico("copy")}</button></div></div>`).join("")}
    <button class="btn pri full mt" id="k_ok">Xong</button>`);
  document.querySelectorAll("[data-cp]").forEach((b) => (b.onclick = () => navigator.clipboard.writeText(b.dataset.cp).then(() => toast("Đã sao chép"), () => toast("Hãy chọn và sao chép thủ công"))));
  $("#k_ok").onclick = closeSheet;
}

// ================= Cloud hãng =================
async function renderAccounts() {
  setTabs(TOP_TABS, "#/accounts");
  app.innerHTML = `<div class="page">${header("Cloud hãng", `<span class="pill">${ico("cloud", 'style="width:14px;height:14px;color:var(--home)"')} Solarman · Deye · Solis · SolaX</span>`, themeBtn(), `<button class="icobtn" id="aAdd" aria-label="Kết nối cloud">${ico("plus")}</button>`)}
    <div class="wrap ${viewCls("top", 2)}" style="padding-top:12px"><div id="al" class="slist"><div class="spin"></div></div></div></div>`;
  if (!S.brands) S.brands = await api("/api/brands").catch(() => []);
  $("#aAdd").onclick = () => accountForm();
  const accs = await api("/api/accounts").catch(() => []);
  $("#al").innerHTML = accs.length ? accs.map((a) => `<div class="sc"><div class="t"><span class="dot ${a.last_error ? "alarm" : a.enabled ? "online" : ""}"></span><h4>${esc(a.label)}</h4><span class="tag b">${esc(BRAND[a.brand] || a.brand)}</span></div>
    <div class="meta"><span>${a.station_count} trạm</span><span>· đồng bộ ${ago(a.last_sync)}</span>${a.enabled ? "" : "<span>· đang tắt</span>"}</div>
    ${a.last_error ? `<p class="small" style="color:var(--danger);margin:6px 0 0">${esc(a.last_error)}</p>` : ""}
    <div class="row2 mt" style="grid-template-columns:1fr 1fr 1fr"><button class="btn" data-sy="${a.id}">Đồng bộ</button><button class="btn" data-tg="${a.id}" data-en="${a.enabled}">${a.enabled ? "Tắt" : "Bật"}</button><button class="btn dan" data-dl="${a.id}">Xóa</button></div></div>`).join("")
    : `<div class="empty">Chưa kết nối cloud nào. Bấm <b>+</b> và chọn hãng (hoặc “Demo” để xem thử).</div>`;
  const al = $("#al");
  al.querySelectorAll("[data-sy]").forEach((b) => (b.onclick = async () => { b.disabled = true; const r = await api(`/api/accounts/${b.dataset.sy}/sync`, { method: "POST" }); toast(r.ok ? `Đã đồng bộ ${r.count} trạm` : "Lỗi: " + r.error); renderAccounts(); }));
  al.querySelectorAll("[data-tg]").forEach((b) => (b.onclick = async () => { await api(`/api/accounts/${b.dataset.tg}`, { method: "PATCH", body: JSON.stringify({ enabled: b.dataset.en !== "1" }) }); renderAccounts(); }));
  al.querySelectorAll("[data-dl]").forEach((b) => (b.onclick = () => confirmSheet("Xóa tài khoản", "Xóa tài khoản này cùng các trạm và lịch sử của nó?", async () => { await api(`/api/accounts/${b.dataset.dl}`, { method: "DELETE" }); renderAccounts(); })));
}
function accountForm() {
  openSheet(`<h2>Kết nối cloud hãng</h2>
    <div class="field"><label for="a_br">Hãng / nền tảng</label><select class="inp" id="a_br">${S.brands.map((b) => `<option value="${b.brand}">${esc(b.label)}</option>`).join("")}</select></div>
    <p class="note mt" id="a_help"></p>
    <div class="field"><label for="a_lb">Tên gợi nhớ</label><input class="inp" id="a_lb" placeholder="VD: Solarman - tài khoản công ty"></div>
    <div id="a_fs"></div><p class="small" id="a_err" style="color:var(--danger);min-height:18px"></p>
    <div class="row2"><button class="btn" id="a_x">Huỷ</button><button class="btn pri" id="a_ok">Kiểm tra & lưu</button></div>`);
  const fields = () => {
    const b = S.brands.find((x) => x.brand === $("#a_br").value);
    $("#a_help").textContent = b?.help || "";
    $("#a_fs").innerHTML = (b?.fields || []).map((f) => `<div class="field"><label for="c_${f.key}">${esc(f.label)}${f.optional ? " (không bắt buộc)" : ""}</label><input class="inp" id="c_${f.key}" data-f="${f.key}" type="${f.type || "text"}" placeholder="${esc(f.placeholder || "")}" autocomplete="off"></div>`).join("");
  };
  fields();
  $("#a_br").onchange = fields;
  $("#a_x").onclick = closeSheet;
  $("#a_ok").onclick = async () => {
    const creds = {};
    document.querySelectorAll("#a_fs [data-f]").forEach((i) => (creds[i.dataset.f] = i.value));
    const btn = $("#a_ok"); btn.disabled = true; btn.textContent = "Đang kết nối…";
    try { const r = await api("/api/accounts", { method: "POST", body: JSON.stringify({ brand: $("#a_br").value, label: $("#a_lb").value, creds }) }); closeSheet(); toast(`Kết nối thành công: ${r.count} trạm`); renderAccounts(); }
    catch (e) { $("#a_err").textContent = e.message; btn.disabled = false; btn.textContent = "Kiểm tra & lưu"; }
  };
}

// ================= Trang chia sẻ cho khách =================
async function renderShare(h) {
  const tab = h.includes("history") ? "history" : "overview";
  setTabs([["#/overview", "home", "Tổng quan"], ["#/history", "chart", "Lịch sử"]], "#/" + tab);
  app.innerHTML = `<div class="page"><div id="sh"></div><div class="wrap ${viewCls("share", tab === "history" ? 1 : 0)}" style="padding-top:12px" id="sv"><div class="spin"></div></div>
    <p class="small muted" style="text-align:center;margin:18px 0">Giám sát bởi INSOLAR Việt Nam</p></div>`;
  try { await loadDetail(); } catch (e) { $("#sv").innerHTML = `<div class="empty">Link không hợp lệ hoặc đã bị thu hồi.</div>`; return; }
  drawStationHeader(S.st, S.st.id);
  if (tab === "history") return viewHistory();
  return viewOverview();
}

// ================= Khởi động =================
(async function start() {
  if (SHARE || PREVIEW) return render();
  try { await api("/api/me"); if (location.hash === "#/login") location.hash = "#/"; render(); } catch {}
})();
</script>
