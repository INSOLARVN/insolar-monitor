; Firmware gateway INSOLAR cho ESP32 (DevKit V1 / ESP32-WROOM-32)
; Nạp: cài VS Code + PlatformIO, mở thư mục firmware, bấm Upload.
[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DGW_ENABLE_BLE=1
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  links2004/WebSockets@2.6.1
  tzapu/WiFiManager@2.0.17
  h2zero/NimBLE-Arduino@1.4.3
